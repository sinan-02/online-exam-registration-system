<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam Registration System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .tab-content {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 600;
            border-left: 3px solid #ff6b35;
            padding-left: 12px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 0.9rem;
            color: white;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ff6b35;
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        select {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #000000;
            transition: all 0.3s;
            cursor: pointer;
        }

        select option {
            color: #000000;
            background: #ffffff;
        }

        select:focus {
            outline: none;
            border-color: #ff6b35;
        }

        select[multiple] {
            background: #ffffff;
            min-height: 150px;
        }

        select[multiple] option {
            padding: 8px;
            margin: 2px 0;
        }

        select[multiple] option:checked {
            background: #ff6b35;
            color: white;
        }

        .signin-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 12px;
        }

        .signin-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .register-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
        }

        .register-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-1px);
        }

        .alert {
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.8rem;
        }

        .alert-info {
            background: rgba(96, 165, 250, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #93c5fd;
        }

        .app-card {
            background: #2a2a3e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #4a4a6a;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .app-card:hover {
            background: #3a3a50;
            border-color: #ff6b35;
            transform: translateX(3px);
        }

        .app-card strong {
            color: #ff6b35;
            font-size: 1rem;
            display: block;
            margin-bottom: 8px;
        }

        .app-card-detail {
            color: #e2e8f0;
            font-size: 0.85rem;
            margin: 6px 0;
            line-height: 1.4;
        }

        .app-card-detail span {
            color: #94a3b8;
            display: inline-block;
            width: 70px;
        }

        .status-pending {
            color: #fbbf24;
            font-weight: bold;
            background: rgba(251, 191, 36, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .status-approved {
            color: #34d399;
            font-weight: bold;
            background: rgba(52, 211, 153, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .status-rejected {
            color: #f87171;
            font-weight: bold;
            background: rgba(248, 113, 113, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .payment-pending {
            color: #fbbf24;
            font-weight: bold;
            background: rgba(251, 191, 36, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .payment-completed {
            color: #34d399;
            font-weight: bold;
            background: rgba(52, 211, 153, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .app-card button {
            margin-top: 12px;
            width: auto;
            padding: 8px 20px;
            font-size: 0.8rem;
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid #ff6b35;
            color: #ff6b35;
            cursor: pointer;
            border-radius: 6px;
        }

        .app-card button:hover {
            background: #ff6b35;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: linear-gradient(135deg, #2a2a3e 0%, #1e1e30 100%);
            border: 1px solid #4a4a6a;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
        }

        .stat-box h3 {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-number {
            color: #ff6b35;
            font-size: 2rem;
            font-weight: 700;
        }

        .ocr-box {
            background: #1a1a2e;
            border: 1px solid #3a3a50;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .ocr-box strong {
            color: #ffffff;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #3a3a50;
        }

        .ocr-result-content {
            background: #0d0d1a;
            border-radius: 10px;
            padding: 15px;
            font-size: 0.85rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .ocr-data-row {
            display: flex;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ocr-label {
            width: 100px;
            font-weight: 600;
            color: #94a3b8;
        }

        .ocr-value {
            flex: 1;
            color: #f1f5f9;
            word-break: break-word;
        }

        .ocr-small-note {
            margin-top: 10px;
            font-size: 0.7rem;
            color: #64748b;
            text-align: center;
            padding-top: 8px;
        }

        .welcome-section {
            margin-bottom: 10px;
        }

        .welcome-text {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .hall-ticket-badge {
            display: inline-block;
            background: #34d399;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .ocr-label {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Online Exam Registration System</h1>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="tab-content">
            <div class="card">
                <h2>Account Login</h2>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <div class="form-group">
                    <label>Login As</label>
                    <select id="loginRole">
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="signin-btn" onclick="handleLogin()">Sign In</button>
                <button class="register-btn" onclick="showRegisterForm()">Create New Account</button>
                <div class="alert alert-info">
                    Demo Admin: admin@oers.com / admin123
                </div>
            </div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="tab-content hidden">
            <div class="card">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password">
                </div>
                <button class="signin-btn" onclick="handleRegister()">Sign Up</button>
                <button class="register-btn" onclick="showLoginForm()">Back to Login</button>
            </div>
        </div>

        <!-- Student Dashboard -->
        <div id="studentDashboard" class="tab-content hidden">
            <div class="card">
                <div class="welcome-section">
                    <span class="welcome-text">Welcome, <span id="studentName"></span></span>
                </div>
                <div id="studentAlert"></div>
            </div>

            <div class="card">
                <h2>Apply for Examination</h2>
                <div class="form-group">
                    <label>Select Exam</label>
                    <select id="examName">
                        <option value="JEE Main">JEE Main</option>
                        <option value="JEE Advanced">JEE Advanced</option>
                        <option value="NEET UG">NEET UG</option>
                        <option value="BITSAT">BITSAT</option>
                        <option value="VITEEE">VITEEE</option>
                        <option value="SRMJEE">SRMJEE</option>
                        <option value="COMEDK">COMEDK</option>
                        <option value="GATE">GATE</option>
                        <option value="CAT">CAT</option>
                        <option value="UPSC Prelims">UPSC Prelims</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select Subjects (Hold Ctrl to select multiple)</label>
                    <select id="subjects" multiple size="5">
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Biology">Biology</option>
                        <option value="English">English</option>
                        <option value="Reasoning">Reasoning</option>
                        <option value="Aptitude">Aptitude</option>
                        <option value="GK">General Knowledge</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Preferred Exam Center</label>
                    <input type="text" id="preferredCenter" placeholder="Enter your preferred exam city">
                </div>
                <div class="form-group">
                    <label>Exam Date</label>
                    <input type="date" id="examDate">
                </div>
                <div class="form-group">
                    <label>Upload ID Document</label>
                    <input type="file" id="ocrFile" accept="image/*">
                    <button onclick="performOCR()" style="margin-top: 10px;">Extract Data via OCR</button>
                </div>
                <div class="ocr-box">
                    <strong>OCR Extracted Information</strong>
                    <div id="ocrResult" class="ocr-result-content">
                        <div class="ocr-data-row"><div class="ocr-label">Name:</div><div class="ocr-value" id="ocrNameValue">-</div></div>
                        <div class="ocr-data-row"><div class="ocr-label">ID Number:</div><div class="ocr-value" id="ocrIdValue">-</div></div>
                        <div class="ocr-data-row"><div class="ocr-label">DOB:</div><div class="ocr-value" id="ocrDobValue">-</div></div>
                        <div class="ocr-data-row"><div class="ocr-label">Address:</div><div class="ocr-value" id="ocrAddressValue">-</div></div>
                        <div class="ocr-small-note">Upload ID and click Extract</div>
                    </div>
                </div>
                <button onclick="submitApplication()" style="margin-top: 20px;">Submit Application</button>
            </div>

            <div class="card">
                <h2>My Applications</h2>
                <div id="applicationsList"></div>
            </div>

            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminDashboard" class="tab-content hidden">
            <div class="card">
                <h2>Admin Dashboard</h2>
                <div id="adminStats" class="stats-grid"></div>
                <h3 style="color: white; margin-bottom: 15px;">All Applications</h3>
                <div id="adminApplicationsList"></div>
                <button class="logout-btn" onclick="logout()" style="margin-top: 20px;">Logout</button>
            </div>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('oers_students') || '[]');
        let applications = JSON.parse(localStorage.getItem('oers_applications') || '[]');
        let payments = JSON.parse(localStorage.getItem('oers_payments') || '[]');
        let currentUser = null;
        let currentAdmin = null;

        function saveData() {
            localStorage.setItem('oers_students', JSON.stringify(students));
            localStorage.setItem('oers_applications', JSON.stringify(applications));
            localStorage.setItem('oers_payments', JSON.stringify(payments));
        }

        function showLoginForm() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('studentDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }

        function showRegisterForm() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('studentDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }

        function showStudentDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('studentDashboard').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            loadStudentDashboard();
        }

        function showAdminDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('studentDashboard').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadAdminDashboard();
        }

        function logout() {
            currentUser = null;
            currentAdmin = null;
            showLoginForm();
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!name || !email || !phone || !password) {
                alert('Please fill all fields');
                return;
            }

            if (students.find(s => s.email === email)) {
                alert('Email already registered');
                return;
            }

            const newStudent = { id: 'STU' + Date.now(), name, email, phone, password };
            students.push(newStudent);
            saveData();
            alert('Registration successful! Please login.');
            showLoginForm();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            if (role === 'admin') {
                if (email === 'admin@oers.com' && password === 'admin123') {
                    currentAdmin = { email };
                    currentUser = null;
                    showAdminDashboard();
                    alert('Welcome Admin');
                } else {
                    alert('Invalid admin credentials');
                }
            } else {
                const student = students.find(s => s.email === email && s.password === password);
                if (student) {
                    currentUser = student;
                    currentAdmin = null;
                    showStudentDashboard();
                    alert('Welcome ' + student.name);
                } else {
                    alert('Invalid credentials');
                }
            }
        }

        function performOCR() {
            const fileInput = document.getElementById('ocrFile');
            if (!fileInput.files || !fileInput.files[0]) {
                alert('Please select an ID document first');
                return;
            }
            
            document.getElementById('ocrNameValue').innerHTML = currentUser?.name || 'Extracted Name';
            document.getElementById('ocrIdValue').innerHTML = 'ID' + Math.floor(Math.random() * 100000);
            document.getElementById('ocrDobValue').innerHTML = '15/03/1998';
            document.getElementById('ocrAddressValue').innerHTML = 'Extracted from document';
            alert('OCR extraction completed!');
        }

        function submitApplication() {
            if (!currentUser) {
                alert('Please login first');
                return;
            }
            
            const examName = document.getElementById('examName').value;
            const subjects = Array.from(document.getElementById('subjects').selectedOptions).map(opt => opt.value);
            const preferredCenter = document.getElementById('preferredCenter').value.trim();
            const examDate = document.getElementById('examDate').value;
            
            if (!examName || subjects.length === 0 || !preferredCenter || !examDate) {
                alert('Please fill all fields and select subjects');
                return;
            }
            
            const newApp = {
                id: 'APP' + Date.now(),
                studentId: currentUser.id,
                studentName: currentUser.name,
                studentEmail: currentUser.email,
                examName: examName,
                subjects: subjects,
                preferredCenter: preferredCenter,
                examDate: examDate,
                status: 'pending',
                paymentStatus: 'pending',
                hallTicketGenerated: false,
                hallTicketNo: null
            };
            
            applications.push(newApp);
            saveData();
            alert('Application submitted! Waiting for admin approval.');
            loadStudentDashboard();
        }

        function processPayment(appId) {
            const method = prompt('Payment Method (UPI/Card/NetBanking):', 'UPI');
            if (!method) return;
            
            const payment = {
                id: 'PAY' + Date.now(),
                applicationId: appId,
                amount: 500,
                method: method,
                transactionId: 'TXN' + Math.floor(Math.random() * 10000000)
            };
            payments.push(payment);
            
            const app = applications.find(a => a.id === appId);
            if (app) app.paymentStatus = 'completed';
            saveData();
            alert('Payment Successful! Transaction ID: ' + payment.transactionId);
            loadStudentDashboard();
            if (currentAdmin) loadAdminDashboard();
        }

        function downloadHallTicket(appId) {
            const app = applications.find(a => a.id === appId);
            if (!app || !app.hallTicketGenerated) {
                alert('Hall ticket not available yet. Wait for admin to generate it.');
                return;
            }
            
            const html = `
            <!DOCTYPE html>
            <html>
            <head><title>Hall Ticket - ${app.examName}</title></head>
            <body style="font-family: Arial; padding: 40px; text-align: center;">
                <h1>HALL TICKET</h1>
                <hr>
                <p><strong>Student Name:</strong> ${app.studentName}</p>
                <p><strong>Exam:</strong> ${app.examName}</p>
                <p><strong>Subjects:</strong> ${app.subjects.join(', ')}</p>
                <p><strong>Center:</strong> ${app.preferredCenter}</p>
                <p><strong>Date:</strong> ${app.examDate}</p>
                <p><strong>Hall Ticket No:</strong> ${app.hallTicketNo || 'HT' + app.id.slice(-6)}</p>
                <hr>
                <p>Online Exam Registration System</p>
            </body>
            </html>`;
            
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'HallTicket_' + app.examName + '_' + app.studentName + '.html';
            a.click();
            URL.revokeObjectURL(url);
            alert('Hall ticket downloaded!');
        }

        function loadStudentDashboard() {
            if (!currentUser) return;
            document.getElementById('studentName').innerHTML = currentUser.name;
            
            const myApps = applications.filter(a => a.studentId === currentUser.id);
            const container = document.getElementById('applicationsList');
            
            if (myApps.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">No applications yet</p>';
                return;
            }
            
            container.innerHTML = myApps.map(app => `
                <div class="app-card">
                    <strong>${app.examName}</strong>
                    <div class="app-card-detail"><span>Subjects:</span> ${app.subjects.join(', ')}</div>
                    <div class="app-card-detail"><span>Center:</span> ${app.preferredCenter}</div>
                    <div class="app-card-detail"><span>Date:</span> ${app.examDate}</div>
                    <div class="app-card-detail"><span>Status:</span> <span class="status-${app.status}">${app.status.toUpperCase()}</span></div>
                    <div class="app-card-detail"><span>Payment:</span> <span class="payment-${app.paymentStatus}">${app.paymentStatus.toUpperCase()}</span></div>
                    ${app.hallTicketGenerated ? `<div class="hall-ticket-badge">✓ Hall Ticket Generated</div>` : ''}
                    <div style="margin-top: 12px;">
                        ${app.paymentStatus === 'pending' && app.status !== 'rejected' ? 
                            `<button onclick="processPayment('${app.id}')">Pay Now (₹500)</button>` : ''}
                        ${app.hallTicketGenerated ? 
                            `<button onclick="downloadHallTicket('${app.id}')" style="background:#34d399; border-color:#34d399; color:white;">Download Hall Ticket</button>` : 
                            app.status === 'approved' && app.paymentStatus === 'completed' && !app.hallTicketGenerated ?
                            `<span style="color:#ff6b35;">Waiting for admin to generate hall ticket...</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function loadAdminDashboard() {
            const stats = {
                students: students.length,
                applications: applications.length,
                pending: applications.filter(a => a.status === 'pending').length,
                approved: applications.filter(a => a.status === 'approved').length,
                revenue: payments.reduce((s, p) => s + p.amount, 0)
            };
            
            document.getElementById('adminStats').innerHTML = `
                <div class="stat-box"><h3>Students</h3><div class="stat-number">${stats.students}</div></div>
                <div class="stat-box"><h3>Applications</h3><div class="stat-number">${stats.applications}</div></div>
                <div class="stat-box"><h3>Pending</h3><div class="stat-number">${stats.pending}</div></div>
                <div class="stat-box"><h3>Approved</h3><div class="stat-number">${stats.approved}</div></div>
                <div class="stat-box"><h3>Revenue</h3><div class="stat-number">₹${stats.revenue}</div></div>
            `;
            
            const container = document.getElementById('adminApplicationsList');
            if (applications.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">No applications</p>';
                return;
            }
            
            container.innerHTML = applications.map(app => `
                <div class="app-card">
                    <strong>${app.studentName}</strong> <span style="color:#94a3b8;">(${app.studentEmail})</span>
                    <div class="app-card-detail"><span>Exam:</span> ${app.examName}</div>
                    <div class="app-card-detail"><span>Subjects:</span> ${app.subjects.join(', ')}</div>
                    <div class="app-card-detail"><span>Center:</span> ${app.preferredCenter}</div>
                    <div class="app-card-detail"><span>Date:</span> ${app.examDate}</div>
                    <div class="app-card-detail"><span>Status:</span> <span class="status-${app.status}">${app.status.toUpperCase()}</span></div>
                    <div class="app-card-detail"><span>Payment:</span> ${app.paymentStatus}</div>
                    <div style="margin-top: 12px;">
                        ${app.status === 'pending' ? `
                            <button onclick="updateAppStatus('${app.id}', 'approved')" style="background:#34d399; border-color:#34d399; color:white; margin-right:10px;">Approve</button>
                            <button onclick="updateAppStatus('${app.id}', 'rejected')" style="background:#f87171; border-color:#f87171; color:white;">Reject</button>
                        ` : ''}
                        ${app.status === 'approved' && app.paymentStatus === 'completed' && !app.hallTicketGenerated ?
                            `<button onclick="generateHallTicket('${app.id}')" style="background:#ff6b35; border-color:#ff6b35; color:white;">Generate Hall Ticket</button>` : ''}
                        ${app.hallTicketGenerated ? `<span style="color:#34d399;">✓ Hall Ticket Generated (${app.hallTicketNo})</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function updateAppStatus(appId, status) {
            const app = applications.find(a => a.id === appId);
            if (app) {
                app.status = status;
                saveData();
                alert('Application ' + status.toUpperCase());
                loadAdminDashboard();
                if (currentUser && currentUser.id === app.studentId) loadStudentDashboard();
            }
        }

        function generateHallTicket(appId) {
            const app = applications.find(a => a.id === appId);
            if (app) {
                app.hallTicketGenerated = true;
                app.hallTicketNo = 'HT' + Math.floor(Math.random() * 100000);
                saveData();
                alert('Hall Ticket Generated! Number: ' + app.hallTicketNo);
                loadAdminDashboard();
                if (currentUser && currentUser.id === app.studentId) loadStudentDashboard();
            }
        }
    </script>
</body>
</html>
